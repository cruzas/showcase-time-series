name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lint does not need torch, so install ruff alone and keep this job fast.
      - name: Install ruff
        run: pipx install "ruff==0.16.5"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # torch must come from the CPU index explicitly. PyPI carries the same
      # version numbers for the CUDA builds and pip is free to pick those,
      # which blows past the runner's disk budget. Installing torch first means
      # requirements.txt sees it as already satisfied.
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      # requirements.txt is exactly what the README tells users to install,
      # so installing it here also checks that the instructions still work.
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Show resolved environment
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -c "import pandas, sklearn; print('pandas', pandas.__version__, 'sklearn', sklearn.__version__)"

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
