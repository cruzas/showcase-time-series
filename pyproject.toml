# Tool configuration only. This repository is a notebook-driven showcase, not
# an installable package: runtime dependencies live in requirements.txt and
# development tools in requirements-dev.txt.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Bare `pytest` (what CI runs) does not put the invocation directory on
# sys.path, so make the repo root explicit for `from src... import`.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
]

[tool.ruff]
# src/ is already formatted at 79 columns; keep that rather than reflowing it.
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# Enforced at zero violations, so CI fails on any regression.
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime/syntax errors
    "F",   # pyflakes
    "I",   # isort: import ordering
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
